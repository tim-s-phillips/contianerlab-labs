/*
 * Lab 02 - user access ports and a read-only NETCONF account.
 *
 * vrnetlab concatenates this file onto its own init.conf to build
 * juniper.conf, so it is loaded as part of the boot configuration and must
 * be in curly-brace format. The base config already provides host-name, the
 * admin super-user, fxp0 management addressing and "services netconf ssh".
 * Everything below is additive.
 */
system {
    login {
        /*
         * Read-only class for telemetry. NETCONF RPCs are authorised against
         * the CLI command they map to, so "view" is what lets get-*
         * RPCs through. There is no "configure" permission here, so the
         * account cannot enter configuration mode at all - deny-commands is
         * belt and braces, and makes the intent obvious in the config.
         *
         * The three RPCs the poller runs are all operational, so strictly it
         * only needs "view". "view-configuration" is here deliberately, to
         * show the next boundary out: it permits reading the configuration
         * but not secrets, which need the separate "secret" permission this
         * class does not have. Drop it if you want the account truly minimal.
         */
        class netconf-ro {
            idle-timeout 15;
            permissions [ view view-configuration ];
            deny-commands "^(clear|configure|edit|file|request|restart|set|start|test)";
        }
        /*
         * Lab password: Telemetry.123
         * Regenerate with: openssl passwd -6 '<new password>'
         */
        user telemetry {
            full-name "read-only NETCONF telemetry account";
            class netconf-ro;
            authentication {
                encrypted-password "$6$clabjunos$QFNfjJk.yaE/85C0mVZa6VloatonIlypCvnADWG6TpDKT0HhsT608DEV0y9dJnnXDYO7PCUbsw.OxxZ2/UwuE1";
            }
        }
    }
    services {
        netconf {
            ssh;
        }
    }
}
interfaces {
    ge-0/0/0 {
        description "user1 - desk 101";
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members users;
                }
            }
        }
    }
    ge-0/0/1 {
        description "user2 - desk 102";
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members users;
                }
            }
        }
    }
    ge-0/0/2 {
        description "user3 - desk 103";
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members users;
                }
            }
        }
    }
    ge-0/0/3 {
        description "user4 - meeting room";
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members users;
                }
            }
        }
    }
    irb {
        unit 0 {
            description "users VLAN gateway";
            family inet {
                address 10.10.10.1/24;
            }
        }
    }
}
vlans {
    users {
        vlan-id 10;
        l3-interface irb.0;
    }
}
