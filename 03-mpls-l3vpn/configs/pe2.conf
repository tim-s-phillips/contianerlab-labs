frr version 9.1
frr defaults traditional
hostname pe2
log stdout
no ipv6 forwarding
service integrated-vtysh-config
!
! ---------- core interfaces ----------
interface lo
 ip ospf area 0
!
interface eth1
 description core-to-p1
 ip ospf area 0
 ip ospf network point-to-point
!
! ---------- IGP ----------
router ospf
 ospf router-id 10.0.0.3
!
! ---------- label distribution ----------
mpls ldp
 router-id 10.0.0.3
 !
 address-family ipv4
  discovery transport-address 10.0.0.3
  interface eth1
 exit-address-family
!
! ---------- VPNv4 iBGP to the far PE ----------
router bgp 65000
 bgp router-id 10.0.0.3
 no bgp default ipv4-unicast
 neighbor 10.0.0.1 remote-as 65000
 neighbor 10.0.0.1 description iBGP-VPNv4-pe1
 neighbor 10.0.0.1 update-source lo
 !
 address-family ipv4 vpn
  neighbor 10.0.0.1 activate
 exit-address-family
!
! ---------- VRF CUST-A ----------
! No CUST-B here. pe2 never imports RT 65000:200, so customer B's
! 192.168.10.0/24 does not exist in this router's tables at all.
router bgp 65000 vrf CUST-A
 bgp router-id 10.0.0.3
 no bgp ebgp-requires-policy
 neighbor 172.20.2.2 remote-as 65100
 neighbor 172.20.2.2 description eBGP-ce-a2
 !
 address-family ipv4 unicast
  neighbor 172.20.2.2 activate
  neighbor 172.20.2.2 as-override
  label vpn export auto
  rd vpn export 65000:100
  rt vpn both 65000:100
  export vpn
  import vpn
 exit-address-family
!
line vty
!
