frr version 9.1
frr defaults traditional
hostname p1
log stdout
no ipv6 forwarding
service integrated-vtysh-config
!
! Transit P router. Runs OSPF and LDP, no BGP at all.
! It has no knowledge of any customer prefix and forwards VPN traffic
! purely on labels. `show ip route vrf all` here should stay empty of
! 192.168.x.x, which is the whole point of the design.
!
interface lo
 ip ospf area 0
!
interface eth1
 description core-to-pe1
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth2
 description core-to-pe2
 ip ospf area 0
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.0.0.2
!
mpls ldp
 router-id 10.0.0.2
 !
 address-family ipv4
  discovery transport-address 10.0.0.2
  interface eth1
  interface eth2
 exit-address-family
!
line vty
!
