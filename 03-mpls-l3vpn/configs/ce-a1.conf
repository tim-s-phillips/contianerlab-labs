frr version 9.1
frr defaults traditional
hostname ce-a1
log stdout
no ipv6 forwarding
service integrated-vtysh-config
!
! Customer A, site 1 (VRF CUST-A)
! The customer LAN sits on lo and is advertised to the provider.
!
router bgp 65100
 bgp router-id 192.168.10.1
 no bgp ebgp-requires-policy
 neighbor 172.20.1.1 remote-as 65000
 neighbor 172.20.1.1 description eBGP-to-provider-PE
 !
 address-family ipv4 unicast
  network 192.168.10.0/24
  neighbor 172.20.1.1 activate
 exit-address-family
!
line vty
!
