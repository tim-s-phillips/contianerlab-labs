frr version 9.1
frr defaults traditional
hostname pe1
log stdout
no ipv6 forwarding
service integrated-vtysh-config
!
! ---------- core interfaces ----------
! Addressing and VRF enslavement are applied by scripts/bootstrap-nodes.sh
! before this config matters; FRR picks the addresses up from the kernel.
interface lo
 ip ospf area 0
!
interface eth1
 description core-to-p1
 ip ospf area 0
 ip ospf network point-to-point
!
! ---------- IGP ----------
router ospf
 ospf router-id 10.0.0.1
!
! ---------- label distribution ----------
mpls ldp
 router-id 10.0.0.1
 !
 address-family ipv4
  discovery transport-address 10.0.0.1
  interface eth1
 exit-address-family
!
! ---------- VPNv4 iBGP to the far PE ----------
! p1 is deliberately not a BGP speaker. It label-switches VPN traffic
! without holding a single customer route.
router bgp 65000
 bgp router-id 10.0.0.1
 no bgp default ipv4-unicast
 neighbor 10.0.0.3 remote-as 65000
 neighbor 10.0.0.3 description iBGP-VPNv4-pe2
 neighbor 10.0.0.3 update-source lo
 !
 address-family ipv4 vpn
  neighbor 10.0.0.3 activate
 exit-address-family
!
! ---------- VRF CUST-A ----------
router bgp 65000 vrf CUST-A
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 neighbor 172.20.1.2 remote-as 65100
 neighbor 172.20.1.2 description eBGP-ce-a1
 !
 address-family ipv4 unicast
  neighbor 172.20.1.2 activate
  ! Both customer sites use AS 65100. Without as-override the far site
  ! drops the route as an AS-path loop.
  neighbor 172.20.1.2 as-override
  label vpn export auto
  rd vpn export 65000:100
  rt vpn both 65000:100
  export vpn
  import vpn
 exit-address-family
!
! ---------- VRF CUST-B ----------
! Same PE-CE subnet and same customer prefix as CUST-A, different RD/RT.
router bgp 65000 vrf CUST-B
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 neighbor 172.20.1.2 remote-as 65200
 neighbor 172.20.1.2 description eBGP-ce-b1
 !
 address-family ipv4 unicast
  neighbor 172.20.1.2 activate
  neighbor 172.20.1.2 as-override
  label vpn export auto
  rd vpn export 65000:200
  rt vpn both 65000:200
  export vpn
  import vpn
 exit-address-family
!
line vty
!
