frr version 9.1
frr defaults traditional
hostname transit1
log stdout
no ipv6 forwarding
service integrated-vtysh-config
!
! ---------- interfaces ----------
interface lo
 description stand-in "internet" prefix
 ip address 198.51.100.1/24
!
interface eth1
 description to-pe1
 ip address 203.0.113.2/30
!
interface eth2
 description to-pe2
 ip address 203.0.113.6/30
!
! ---------- BGP ----------
router bgp 65002
 bgp router-id 198.51.100.1
 no bgp ebgp-requires-policy
 !
 neighbor 203.0.113.1 remote-as 65001
 neighbor 203.0.113.1 description eBGP-pe1
 !
 neighbor 203.0.113.5 remote-as 65001
 neighbor 203.0.113.5 description eBGP-pe2
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
  neighbor 203.0.113.1 activate
  neighbor 203.0.113.5 activate
 exit-address-family
!
line vty
!
