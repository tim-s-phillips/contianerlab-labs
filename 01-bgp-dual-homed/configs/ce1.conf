frr version 9.1
frr defaults traditional
hostname ce1
log stdout
no ipv6 forwarding
service integrated-vtysh-config
!
! ---------- interfaces ----------
interface lo
 description customer LAN (advertised to provider)
 ip address 192.168.100.1/24
!
interface eth1
 description to-pe1 (primary)
 ip address 172.16.1.1/30
!
interface eth2
 description to-pe2 (backup)
 ip address 172.16.2.1/30
!
! ---------- BGP ----------
router bgp 65100
 bgp router-id 192.168.100.1
 no bgp ebgp-requires-policy
 !
 neighbor 172.16.1.2 remote-as 65001
 neighbor 172.16.1.2 description eBGP-pe1-primary
 !
 neighbor 172.16.2.2 remote-as 65001
 neighbor 172.16.2.2 description eBGP-pe2-backup
 !
 address-family ipv4 unicast
  network 192.168.100.0/24
  neighbor 172.16.1.2 activate
  neighbor 172.16.2.2 activate
  neighbor 172.16.2.2 route-map BACKUP-OUT out
 exit-address-family
!
! Prepend our own ASN twice on the backup link so the provider
! prefers the pe1 path on AS-path length as well as local-pref.
! Belt and braces: local-pref decides inside AS 65001, prepending
! is what a customer can influence from their own side.
route-map BACKUP-OUT permit 10
 set as-path prepend 65100 65100
!
line vty
!
